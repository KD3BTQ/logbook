<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADIF Log Manager</title>
<style>
  /* Deliberately plain styling - just enough to make the form readable. */
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 20px;
    max-width: 900px;
  }
  fieldset {
    margin-bottom: 15px;
    padding: 10px 15px;
  }
  legend {
    font-weight: bold;
  }
  .field-row {
    margin-bottom: 6px;
  }
  .field-row label {
    display: inline-block;
    width: 170px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 15px;
  }
  th, td {
    border: 1px solid #999;
    padding: 4px 8px;
    text-align: left;
  }
  button {
    margin-right: 8px;
  }
  /* The entry form is shown as a pop-up (modal) over the rest of the page. */
  #entryFormOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: flex-start;
    padding: 30px 15px;
    overflow-y: auto;
  }
  #entryForm {
    background: white;
    border: 1px solid #999;
    padding: 15px 20px;
    width: 100%;
    max-width: 600px;
  }
  #currentFileLabel {
    font-style: italic;
    margin-left: 10px;
  }
  .extra-field-row {
    margin-bottom: 6px;
  }
  .extra-field-row input {
    margin-right: 6px;
  }
  .extraFieldName {
    width: 180px;
  }
  .extraFieldValue {
    width: 260px;
  }
  .auto-filled {
    border: 2px solid orange;
  }
  .missing-required {
    border: 2px solid red;
  }
  .incomplete-qso td {
    border: 2px solid red;
  }
  #missingFieldsWarning {
    display: none;
    color: red;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .flag-icon {
    vertical-align: middle;
    margin-left: 3px;
    border: 1px solid #ccc;
  }
  .lookup-status {
    font-size: 0.85em;
    font-style: italic;
    margin-left: 6px;
    color: #555;
  }
  .help-icon {
    display: inline-block;
    position: relative;
    width: 14px;
    height: 14px;
    line-height: 14px;
    border-radius: 50%;
    background: #ddd;
    color: #333;
    font-size: 10px;
    font-weight: normal;
    text-align: center;
    cursor: help;
    margin: 0 4px;
  }
  .help-icon .help-tooltip {
    display: none;
    position: absolute;
    top: 18px;
    left: 0;
    width: 240px;
    background: #ffffe0;
    border: 1px solid #999;
    padding: 8px;
    font-size: 12px;
    font-weight: normal;
    text-align: left;
    color: #000;
    z-index: 10;
    box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
  }
  .help-icon:hover .help-tooltip {
    display: block;
  }
  .help-tooltip a {
    display: inline-block;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h1>ADIF Log Manager</h1>

<!-- ============ File controls ============ -->
<div id="fileControls">
  <button id="newFileBtn">New File</button>
  <input type="file" id="openFileInput" accept=".adi,.adif,.txt">
  <button id="saveFileBtn">Save / Download ADIF File</button>
  <button id="exportCsvBtn">Export to CSV</button>
  <span id="currentFileLabel">(no file loaded)</span>
</div>

<hr>

<!-- ============ Station setup (used to prefill new QSOs) ============ -->
<fieldset id="stationSetup">
  <legend>Station Setup</legend>
  <div class="field-row">
    <label for="mainCallsign">My Callsign:</label>
    <input type="text" id="mainCallsign">
  </div>
  <div class="field-row">
    <label for="mainOperator">My Operator:</label>
    <input type="text" id="mainOperator">
  </div>
  <div class="field-row">
    <label for="mainGrid">My Grid:</label>
    <input type="text" id="mainGrid">
  </div>
</fieldset>

<hr>

<!-- ============ QSO list ============ -->
<h2>Log Entries</h2>
<button id="addNewBtn">Add New QSO</button>
<table id="qsoTable">
  <thead>
    <tr>
      <th>Date</th>
      <th>Time</th>
      <th>Band</th>
      <th>Mode</th>
      <th>Callsign</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="qsoTableBody">
    <!-- Rows are generated by refreshTable() -->
  </tbody>
</table>

<!-- ============ Entry form pop-up (used for both adding and editing) ============ -->
<div id="entryFormOverlay" onclick="if (event.target === this) cancelEntry();">
<div id="entryForm">
  <h2 id="formTitle">New QSO</h2>
  <div id="missingFieldsWarning">Missing required fields: <span id="missingFieldsList"></span></div>

  <fieldset>
    <legend>1. QSO Info</legend>
    <div class="field-row">
      <label for="qsoDate">Date:</label>
      <input type="date" id="qsoDate">
    </div>
    <div class="field-row">
      <label for="qsoTime">Time (UTC):</label>
      <input type="time" id="qsoTime">
    </div>
    <div class="field-row">
      <label for="qsoBand">Band:</label>
      <input type="text" id="qsoBand" list="bandList">
    </div>
    <div class="field-row">
      <label for="qsoFreq">Frequency (MHz):</label>
      <input type="number" step="any" id="qsoFreq">
    </div>
    <div class="field-row">
      <label for="qsoMode">Mode:</label>
      <input type="text" id="qsoMode" list="modeList">
    </div>
    <div class="field-row">
      <label for="qsoRstSent">RST Sent:</label>
      <input type="text" id="qsoRstSent">
    </div>
    <div class="field-row">
      <label for="qsoRstRcvd">RST Received:</label>
      <input type="text" id="qsoRstRcvd">
    </div>
    <div class="field-row">
      <label for="qsoTxPower">TX Power (W):</label>
      <input type="number" step="any" id="qsoTxPower">
    </div>
  </fieldset>

  <fieldset>
    <legend>2. Receiver Info (station worked)</legend>
    <div class="field-row">
      <label for="rxCall">Callsign:</label>
      <input type="text" id="rxCall">
      <button type="button" id="rxLookupBtn">Look up online</button>
      <span id="rxLookupStatus" class="lookup-status"></span>
    </div>
    <div class="field-row">
      <label for="rxOperator">Operator (optional):</label>
      <input type="text" id="rxOperator">
    </div>
    <div class="field-row">
      <label for="rxGrid">Grid Square:</label>
      <input type="text" id="rxGrid">
    </div>
    <div class="field-row">
      <label for="rxPower">TX Power (W):</label>
      <input type="number" step="any" id="rxPower">
    </div>
    <div class="field-row">
      <label for="rxLat">Latitude:</label>
      <input type="number" step="any" id="rxLat">
    </div>
    <div class="field-row">
      <label for="rxLon">Longitude:</label>
      <input type="number" step="any" id="rxLon">
    </div>
    <div class="field-row">
      <label for="rxCounty">County:</label>
      <input type="text" id="rxCounty">
    </div>
    <div class="field-row">
      <label for="rxCqZone">CQ Zone:</label>
      <input type="number" step="1" id="rxCqZone">
    </div>
    <div class="field-row">
      <label for="rxItuZone">ITU Zone:</label>
      <input type="number" step="1" id="rxItuZone">
    </div>
    <div class="field-row">
      <label for="rxCity">QTH City:</label>
      <input type="text" id="rxCity">
    </div>
    <div class="field-row">
      <label for="rxState">QTH State:</label>
      <input type="text" id="rxState">
    </div>
    <div class="field-row">
      <label for="rxCountry">QTH Country:</label>
      <input type="text" id="rxCountry">
    </div>
  </fieldset>

  <fieldset>
    <legend>3. Sender Info (this station, for this QSO)</legend>
    <div class="field-row">
      <label for="txCall">Callsign:</label>
      <input type="text" id="txCall">
      <button type="button" id="txLookupBtn">Look up online</button>
      <span id="txLookupStatus" class="lookup-status"></span>
    </div>
    <div class="field-row">
      <label for="txOperator">Operator:</label>
      <input type="text" id="txOperator">
    </div>
    <div class="field-row">
      <label for="txGrid">Grid Square:</label>
      <input type="text" id="txGrid">
    </div>
    <div class="field-row">
      <label for="txLat">Latitude:</label>
      <input type="number" step="any" id="txLat">
    </div>
    <div class="field-row">
      <label for="txLon">Longitude:</label>
      <input type="number" step="any" id="txLon">
    </div>
    <div class="field-row">
      <label for="txCounty">County:</label>
      <input type="text" id="txCounty">
    </div>
    <div class="field-row">
      <label for="txCqZone">CQ Zone:</label>
      <input type="number" step="1" id="txCqZone">
    </div>
    <div class="field-row">
      <label for="txItuZone">ITU Zone:</label>
      <input type="number" step="1" id="txItuZone">
    </div>
    <div class="field-row">
      <label for="txCity">QTH City:</label>
      <input type="text" id="txCity">
    </div>
    <div class="field-row">
      <label for="txState">QTH State:</label>
      <input type="text" id="txState">
    </div>
    <div class="field-row">
      <label for="txCountry">QTH Country:</label>
      <input type="text" id="txCountry">
    </div>
  </fieldset>

  <fieldset>
    <legend id="otherFieldsLegend">4. Other ADIF Fields</legend>
    <div id="extraFieldsContainer">
      <!-- rows are added here by addExtraFieldRow() -->
    </div>
    <button type="button" id="addExtraFieldBtn">+ Add Custom Field</button>
  </fieldset>

  <button id="saveEntryBtn">Save Entry</button>
  <button id="cancelEntryBtn">Cancel</button>
</div>
</div>

<!-- Suggestion lists for the Band and Mode fields. These are just suggestions -
     the fields are plain text so anything can still be typed in. -->
<datalist id="bandList">
  <option value="2190m"><option value="630m"><option value="560m">
  <option value="160m"><option value="80m"><option value="60m">
  <option value="40m"><option value="30m"><option value="20m">
  <option value="17m"><option value="15m"><option value="12m">
  <option value="10m"><option value="8m"><option value="6m">
  <option value="5m"><option value="4m"><option value="2m">
  <option value="1.25m"><option value="70cm"><option value="33cm">
  <option value="23cm"><option value="13cm"><option value="9cm">
  <option value="6cm"><option value="3cm"><option value="1.25cm">
  <option value="6mm"><option value="4mm"><option value="2.5mm">
  <option value="2mm"><option value="1mm"><option value="submm">
</datalist>

<datalist id="modeList">
  <option value="CW"><option value="SSB"><option value="FM">
  <option value="AM"><option value="RTTY"><option value="PSK31">
  <option value="FT8"><option value="FT4"><option value="JT65">
  <option value="JT9"><option value="JS8"><option value="MFSK">
  <option value="OLIVIA"><option value="HELL"><option value="DOMINO">
  <option value="THOR"><option value="PACTOR"><option value="WSPR">
  <option value="SSTV"><option value="DIGITALVOICE"><option value="DSTAR">
  <option value="C4FM"><option value="DMR">
</datalist>

<!-- Populated by JS at load time with every standard ADIF field name that
     isn't already covered by one of the form fields above. -->
<datalist id="otherAdifFieldsList"></datalist>

<script>

  // ============================================================
  // REQUIRED FIELDS
  // ------------------------------------------------------------
  // A QSO must have a non-empty value in every field listed here
  // before it can be saved. Write these EXACTLY as the field name
  // appears in the ADIF spec (e.g. 'QSO_DATE', 'CALL', 'OPERATOR',
  // 'MY_GRIDSQUARE') - the same names used as "adif" in fieldMap,
  // further down. Do NOT include the ":LENGTH" part you'd see in
  // a raw ADIF file (e.g. <OPERATOR:8>KJ4ABC12) - that length is
  // just the byte-count of that field's value in one specific QSO
  // record, not part of the field's name, and it's computed
  // automatically wherever this file writes an ADIF field.
  //
  // Only fields that have their own input in the form (i.e. ones
  // listed in fieldMap) can be required this way - a name that
  // doesn't match any fieldMap entry is ignored (with a console
  // warning at load time, to help catch typos) rather than
  // breaking anything, since there's no fixed input box to
  // highlight for it.
  //
  // An existing QSO that's missing one of these (e.g. one loaded
  // from a file created by other software, or an older/looser
  // version of this file) shows up in the log list with a red
  // border, and opening it for editing highlights exactly which
  // fields still need to be filled in.
  // ============================================================
  const REQUIRED_FIELDS = ['QSO_DATE', 'TIME_ON', 'BAND', 'MODE', 'CALL', 'OPERATOR', 'STATION_CALLSIGN', 'MY_GRIDSQUARE'];

  // ============================================================
  // ADIF Log Manager
  //
  // This page keeps the whole log in memory as an array of plain
  // JS objects (qsoList). Each object's property names match the
  // ids of the form fields (see fieldMap below), so reading the
  // form into an object and writing an object back into the form
  // is just a loop over fieldMap.
  //
  // ADIF-specific details (field names, date/time formats, and the
  // lat/lon "Location" format) are only dealt with in two places:
  // buildAdifFile() when saving, and parseAdifFile() when opening.
  // ============================================================

  let qsoList = [];        // the whole log, in memory
  let editingIndex = null; // null = adding a new entry, otherwise index being edited
  let currentFileName = 'log.adi';

  // Maps each form field to its ADIF field name, and says how the
  // value needs to be converted when writing/reading an ADIF file.
  //   'text'         - stored as-is
  //   'date'         - form uses YYYY-MM-DD, ADIF uses YYYYMMDD
  //   'time'         - form uses HH:MM, ADIF uses HHMM
  //   'location-lat' - form uses decimal degrees, ADIF uses "Nddd mm.mmm"
  //   'location-lon' - same as above, but E/W instead of N/S
  const fieldMap = [
    { formId: 'qsoDate',    adif: 'QSO_DATE',         type: 'date',
      help: 'The UTC date the contact took place.' },
    { formId: 'qsoTime',    adif: 'TIME_ON',          type: 'time',
      help: 'The UTC time the contact started.' },
    { formId: 'qsoBand',    adif: 'BAND',             type: 'text',
      help: 'The amateur radio band the contact was made on, e.g. 20m or 2m.' },
    { formId: 'qsoFreq',    adif: 'FREQ',             type: 'text',
      help: 'The operating frequency, in megahertz (MHz).' },
    { formId: 'qsoMode',    adif: 'MODE',             type: 'text',
      help: 'The mode used for the contact, e.g. SSB, CW, or FT8.' },
    { formId: 'qsoRstSent', adif: 'RST_SENT',         type: 'text',
      help: 'The signal report you sent to the other station.' },
    { formId: 'qsoRstRcvd', adif: 'RST_RCVD',         type: 'text',
      help: 'The signal report you received from the other station.' },
    { formId: 'qsoTxPower', adif: 'TX_PWR',           type: 'text',
      help: 'Your transmitter power, in watts, during this contact.' },

    { formId: 'rxCall',     adif: 'CALL',             type: 'text',
      help: 'The callsign of the station you contacted. The "Look up online" button can fill in QTH City/State/Country (and grid, if available) from Callook.info (and HamDB.org, if the optional proxy is set up), when you have an internet connection.' },
    { formId: 'rxOperator', adif: 'CONTACTED_OP',     type: 'text',
      help: 'The callsign of the person actually operating the other station, if different from their callsign - for example a guest operator at a club station. The "Look up online" button fills this in with the licensee\'s name by default, which you can overwrite with an actual operator callsign if you know it.' },
    { formId: 'rxGrid',     adif: 'GRIDSQUARE',       type: 'text',
      help: 'The other station\u2019s Maidenhead grid locator, e.g. FN31pr. Fills in Latitude/Longitude (and CQ/ITU zone) automatically - or enter a lat/lon below and this fills in instead.' },
    { formId: 'rxPower',    adif: 'RX_PWR',           type: 'text',
      help: 'The other station\u2019s transmitter power, in watts.' },
    { formId: 'rxLat',      adif: 'LAT',              type: 'location-lat',
      help: 'The other station\u2019s latitude, in decimal degrees. Auto-filled from the grid square (or fills the grid square in if you type it here), but you can override it.' },
    { formId: 'rxLon',      adif: 'LON',              type: 'location-lon',
      help: 'The other station\u2019s longitude, in decimal degrees. Auto-filled from the grid square (or fills the grid square in if you type it here), but you can override it.' },
    { formId: 'rxCounty',   adif: 'CNTY',             type: 'text',
      help: 'The county the other station was operating from (mainly used for US contacts).' },
    { formId: 'rxCqZone',   adif: 'CQZ',              type: 'text',
      help: 'The CQ (WAZ) zone the other station was operating from. Estimated offline from grid/lat-lon using rough regional boundaries - this is a best guess, not authoritative, so double check it, especially near a zone boundary.' },
    { formId: 'rxItuZone',  adif: 'ITUZ',             type: 'text',
      help: 'The ITU zone the other station was operating from. Estimated offline the same way as CQ zone (and only for some regions) - treat it as a starting point, not a certainty.' },
    { formId: 'rxCity',     adif: 'QTH',              type: 'text',
      help: 'The city or town the other station was operating from.' },
    { formId: 'rxState',    adif: 'STATE',            type: 'text',
      help: 'The state or province the other station was operating from.' },
    { formId: 'rxCountry',  adif: 'COUNTRY',          type: 'text',
      help: 'The country the other station was operating from.' },

    { formId: 'txCall',     adif: 'STATION_CALLSIGN', type: 'text',
      help: 'Your own callsign, as used for this specific contact. The "Look up online" button can fill in QTH City/State/Country (and grid, if available) from Callook.info (and HamDB.org, if the optional proxy is set up), when you have an internet connection.' },
    { formId: 'txOperator', adif: 'OPERATOR',         type: 'text',
      help: 'The callsign of whoever was actually at the key or mic for this contact - useful if more than one operator shares a station.' },
    { formId: 'txGrid',     adif: 'MY_GRIDSQUARE',    type: 'text',
      help: 'Your Maidenhead grid locator for this contact. Fills in Latitude/Longitude (and CQ/ITU zone) automatically - or enter a lat/lon below and this fills in instead.' },
    { formId: 'txLat',      adif: 'MY_LAT',           type: 'location-lat',
      help: 'Your latitude, in decimal degrees, for this contact. Auto-filled from the grid square (or fills the grid square in if you type it here), but you can override it.' },
    { formId: 'txLon',      adif: 'MY_LON',           type: 'location-lon',
      help: 'Your longitude, in decimal degrees, for this contact. Auto-filled from the grid square (or fills the grid square in if you type it here), but you can override it.' },
    { formId: 'txCounty',   adif: 'MY_CNTY',          type: 'text',
      help: 'The county you were operating from.' },
    { formId: 'txCqZone',   adif: 'MY_CQ_ZONE',       type: 'text',
      help: 'The CQ (WAZ) zone you were operating from. Estimated offline from grid/lat-lon using rough regional boundaries - this is a best guess, not authoritative, so double check it, especially near a zone boundary.' },
    { formId: 'txItuZone',  adif: 'MY_ITU_ZONE',      type: 'text',
      help: 'The ITU zone you were operating from. Estimated offline the same way as CQ zone (and only for some regions) - treat it as a starting point, not a certainty.' },
    { formId: 'txCity',     adif: 'MY_CITY',          type: 'text',
      help: 'The city or town you were operating from.' },
    { formId: 'txState',    adif: 'MY_STATE',         type: 'text',
      help: 'The state or province you were operating from.' },
    { formId: 'txCountry',  adif: 'MY_COUNTRY',       type: 'text',
      help: 'The country you were operating from.' }
  ];

  // Every ADIF field name that's already handled by one of the form fields
  // above. Used to figure out which fields from an opened file are "extra"
  // (not covered by the form), and to stop someone adding a custom field
  // that collides with one of these.
  const knownAdifNames = new Set(fieldMap.map(function (f) { return f.adif.toUpperCase(); }));

  // Every QSO-record field name defined in the ADIF 3.1.5 spec (adif.org),
  // aside from the header-only fields (ADIF_VER, PROGRAMID, etc.). Used to
  // fill in the dropdown of suggestions on the "Other ADIF Fields" section,
  // so a field already covered by the form above (see fieldMap) doesn't show
  // up twice - see populateOtherAdifFieldsDatalist() further down.
  const allAdifFieldNames = [
    'ADDRESS', 'ADDRESS_INTL', 'AGE', 'ALTITUDE', 'ANT_AZ', 'ANT_EL', 'ANT_PATH',
    'ARRL_SECT', 'AWARD_GRANTED', 'AWARD_SUBMITTED', 'A_INDEX',
    'BAND', 'BAND_RX',
    'CALL', 'CHECK', 'CLASS', 'CLUBLOG_QSO_UPLOAD_DATE', 'CLUBLOG_QSO_UPLOAD_STATUS',
    'CNTY', 'CNTY_ALT', 'COMMENT', 'COMMENT_INTL', 'CONT', 'CONTACTED_OP', 'CONTEST_ID',
    'COUNTRY', 'COUNTRY_INTL', 'CQZ', 'CREDIT_SUBMITTED', 'CREDIT_GRANTED',
    'DARC_DOK', 'DCL_QSLRDATE', 'DCL_QSLSDATE', 'DCL_QSL_RCVD', 'DCL_QSL_SENT',
    'DISTANCE', 'DXCC',
    'EMAIL', 'EQ_CALL', 'EQSL_QSLRDATE', 'EQSL_QSLSDATE', 'EQSL_QSL_RCVD', 'EQSL_QSL_SENT',
    'FISTS', 'FISTS_CC', 'FORCE_INIT', 'FREQ', 'FREQ_RX',
    'GRIDSQUARE', 'GRIDSQUARE_EXT', 'GUEST_OP',
    'HAMLOGEU_QSO_UPLOAD_DATE', 'HAMLOGEU_QSO_UPLOAD_STATUS',
    'HAMQTH_QSO_UPLOAD_DATE', 'HAMQTH_QSO_UPLOAD_STATUS',
    'HRDLOG_QSO_UPLOAD_DATE', 'HRDLOG_QSO_UPLOAD_STATUS',
    'IOTA', 'IOTA_ISLAND_ID', 'ITUZ',
    'K_INDEX',
    'LAT', 'LON', 'LOTW_QSLRDATE', 'LOTW_QSLSDATE', 'LOTW_QSL_RCVD', 'LOTW_QSL_SENT',
    'MAX_BURSTS', 'MODE', 'MORSE_KEY_INFO', 'MORSE_KEY_TYPE', 'MS_SHOWER',
    'MY_ALTITUDE', 'MY_ANTENNA', 'MY_ANTENNA_INTL', 'MY_ARRL_SECT',
    'MY_CITY', 'MY_CITY_INTL', 'MY_CNTY', 'MY_CNTY_ALT', 'MY_COUNTRY', 'MY_COUNTRY_INTL',
    'MY_CQ_ZONE', 'MY_DARC_DOK', 'MY_DXCC', 'MY_FISTS', 'MY_GRIDSQUARE', 'MY_GRIDSQUARE_EXT',
    'MY_IOTA', 'MY_IOTA_ISLAND_ID', 'MY_ITU_ZONE', 'MY_LAT', 'MY_LON',
    'MY_MORSE_KEY_INFO', 'MY_MORSE_KEY_TYPE', 'MY_NAME', 'MY_NAME_INTL',
    'MY_POSTAL_CODE', 'MY_POSTAL_CODE_INTL', 'MY_POTA_REF', 'MY_RIG', 'MY_RIG_INTL',
    'MY_SIG', 'MY_SIG_INTL', 'MY_SIG_INFO', 'MY_SIG_INFO_INTL', 'MY_SOTA_REF',
    'MY_STATE', 'MY_STREET', 'MY_STREET_INTL', 'MY_USACA_COUNTIES', 'MY_VUCC_GRIDS',
    'MY_WWFF_REF',
    'NAME', 'NAME_INTL', 'NOTES', 'NOTES_INTL', 'NR_BURSTS', 'NR_PINGS',
    'OPERATOR', 'OWNER_CALLSIGN',
    'PFX', 'POTA_REF', 'PRECEDENCE', 'PROP_MODE', 'PUBLIC_KEY',

  // ---------------- Form <-> object helpers ----------------

  function readFormIntoQso() {
    const qso = {};
    fieldMap.forEach(function (f) {
      qso[f.formId] = document.getElementById(f.formId).value.trim();
    });
    return qso;
  }

  function writeQsoIntoForm(qso) {
    fieldMap.forEach(function (f) {
      const el = document.getElementById(f.formId);
      el.value = qso[f.formId] || '';
      el.classList.remove('auto-filled'); // reset styling - this isn't a fresh auto-fill
    });
  }

  function clearForm() {
    fieldMap.forEach(function (f) {
      const el = document.getElementById(f.formId);
      el.value = '';
      el.classList.remove('auto-filled');
    });
  }


  // ---------------- Required-field validation ----------------

  function getFormIdForAdifName(adifName) {
    // Looks up which form field (if any) handles a given ADIF field name,
    // using the same fieldMap the rest of the file already relies on.
    const entry = fieldMap.find(function (f) {
      return f.adif.toUpperCase() === adifName.toUpperCase();
    });
    return entry ? entry.formId : null;
  }

  function getMissingRequiredFields(qso) {
    // Returns the ADIF names (not form ids) of any required field that's
    // empty. Field names in REQUIRED_FIELDS that don't map to an actual
    // form field are skipped here - see warnAboutUnknownRequiredFields().
    return REQUIRED_FIELDS.filter(function (adifName) {
      const formId = getFormIdForAdifName(adifName);
      if (!formId) return false;
      const value = qso[formId];
      return !value || !value.toString().trim();
    });
  }

  function getFieldLabel(adifName) {
    // Reuse the form's own <label> text rather than keeping a separate
    // list of display names - one less thing to keep in sync.
    const formId = getFormIdForAdifName(adifName);
    if (!formId) return adifName;
    const label = document.querySelector('label[for="' + formId + '"]');
    return label ? label.textContent.replace(':', '').trim() : formId;
  }

  function highlightMissingFields(missingAdifNames) {
    missingAdifNames.forEach(function (adifName) {
      const formId = getFormIdForAdifName(adifName);
      if (formId) document.getElementById(formId).classList.add('missing-required');
    });
  }

  function clearRequiredFieldHighlights() {
    REQUIRED_FIELDS.forEach(function (adifName) {
      const formId = getFormIdForAdifName(adifName);
      if (formId) document.getElementById(formId).classList.remove('missing-required');
    });
  }

  function warnAboutUnknownRequiredFields() {
    // A one-time sanity check at load time, so a typo in REQUIRED_FIELDS
    // shows up in the console instead of silently doing nothing.
    REQUIRED_FIELDS.forEach(function (adifName) {
      if (!getFormIdForAdifName(adifName)) {
        console.warn(
          'REQUIRED_FIELDS: "' + adifName + '" is not a recognized ADIF field name ' +
          'from fieldMap, so it will be ignored. Check spelling and omit any ":LENGTH" suffix.'
        );
      }
    });
  }

  function showMissingFieldsWarning(missingFields) {
    document.getElementById('missingFieldsList').textContent =
      missingFields.map(getFieldLabel).join(', ');
    document.getElementById('missingFieldsWarning').style.display = 'block';
  }

  function hideMissingFieldsWarning() {
    document.getElementById('missingFieldsWarning').style.display = 'none';
  }


  // ---------------- Date / time helpers ----------------
  // ADIF dates/times are UTC, so we read/write using the UTC getters.

  function getCurrentUtcDateString() {
    const now = new Date();
    const yyyy = now.getUTCFullYear();
    const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
    const dd = String(now.getUTCDate()).padStart(2, '0');
    return yyyy + '-' + mm + '-' + dd;
  }

  function getCurrentUtcTimeString() {
    const now = new Date();
    const hh = String(now.getUTCHours()).padStart(2, '0');
    const mi = String(now.getUTCMinutes()).padStart(2, '0');
    return hh + ':' + mi;
  }

  function dateToAdif(dateStr) {
    // '2026-09-12' -> '20260912'
    return dateStr.split('-').join('');
  }

  function adifToDate(adifStr) {
    // '20260912' -> '2026-09-12'
    if (!adifStr || adifStr.length < 8) return '';
    return adifStr.slice(0, 4) + '-' + adifStr.slice(4, 6) + '-' + adifStr.slice(6, 8);
  }

  function timeToAdif(timeStr) {
    // '14:30' -> '1430'
    return timeStr.split(':').join('');
  }

  function adifToTime(adifStr) {
    // '1430' or '143015' -> '14:30' (seconds are dropped, the form only shows H:M)
    if (!adifStr || adifStr.length < 4) return '';
    return adifStr.slice(0, 2) + ':' + adifStr.slice(2, 4);
  }


  // ---------------- Lat/Lon helpers ----------------
  // The form uses plain decimal degrees (e.g. -122.676) because that's what
  // most people are used to. ADIF's "Location" type looks like "W122 40.560",
  // so we convert in both directions here.

  function decimalToAdifLocation(decimalStr, isLatitude) {
    if (decimalStr === '' || decimalStr === null || isNaN(parseFloat(decimalStr))) {
      return '';
    }
    const value = parseFloat(decimalStr);
    const positiveLetter = isLatitude ? 'N' : 'E';
    const negativeLetter = isLatitude ? 'S' : 'W';
    const letter = value < 0 ? negativeLetter : positiveLetter;

    const absValue = Math.abs(value);
    let degrees = Math.floor(absValue);
    let minutes = (absValue - degrees) * 60;

    // Rounding can push minutes right up to 60 - roll that over into degrees.
    if (minutes >= 59.9995) {
      minutes = 0;
      degrees += 1;
    }

    const degreesStr = String(degrees).padStart(3, '0');
    const minutesStr = minutes.toFixed(3).padStart(6, '0'); // e.g. "05.500"
    return letter + degreesStr + ' ' + minutesStr;
  }

  function adifLocationToDecimal(adifStr) {
    if (!adifStr) return '';
    const letter = adifStr.charAt(0).toUpperCase();
    const rest = adifStr.slice(1).trim().split(/\s+/); // ["045", "31.380"]
    if (rest.length < 2) return '';

    const degrees = parseFloat(rest[0]);
    const minutes = parseFloat(rest[1]);
    let value = degrees + minutes / 60;
    if (letter === 'S' || letter === 'W') value = -value;

    // Round to 5 decimal places just to keep the number tidy.
    return String(Math.round(value * 100000) / 100000);
  }


  // ---------------- Grid square -> lat/lon helper ----------------
  // Converts a Maidenhead grid locator (2, 4, 6, or 8 characters) into the
  // decimal lat/lon of the center of the square it describes. Used to
  // auto-fill Latitude/Longitude whenever a grid square is entered.

  function gridToLatLon(gridStr) {
    if (!gridStr) return null;
    const grid = gridStr.trim().toUpperCase();
    if (grid.length < 4) return null; // need at least the field + square

    const lonFieldChar = grid.charCodeAt(0) - 65; // 'A' = 0, 'B' = 1, ...
    const latFieldChar = grid.charCodeAt(1) - 65;
    if (lonFieldChar < 0 || lonFieldChar > 17 || latFieldChar < 0 || latFieldChar > 17) {
      return null;
    }

    let lon = -180 + lonFieldChar * 20;
    let lat = -90 + latFieldChar * 10;
    let lonSize = 20;
    let latSize = 10;

    const lonSquare = parseInt(grid.charAt(2), 10);
    const latSquare = parseInt(grid.charAt(3), 10);
    if (isNaN(lonSquare) || isNaN(latSquare)) return null;
    lon += lonSquare * 2;
    lat += latSquare * 1;
    lonSize = 2;
    latSize = 1;

    if (grid.length >= 6) {
      const lonSub = grid.charCodeAt(4) - 65;
      const latSub = grid.charCodeAt(5) - 65;
      if (lonSub >= 0 && lonSub <= 23 && latSub >= 0 && latSub <= 23) {
        lon += lonSub * (2 / 24);
        lat += latSub * (1 / 24);
        lonSize = 2 / 24;
        latSize = 1 / 24;
      }
    }

    if (grid.length >= 8) {
      const lonExt = parseInt(grid.charAt(6), 10);
      const latExt = parseInt(grid.charAt(7), 10);
      if (!isNaN(lonExt) && !isNaN(latExt)) {
        lon += lonExt * (lonSize / 10);
        lat += latExt * (latSize / 10);
        lonSize = lonSize / 10;
        latSize = latSize / 10;
      }
    }

    // Use the center of the smallest square we resolved, not its corner.
    lon += lonSize / 2;
    lat += latSize / 2;

    return {
      lat: Math.round(lat * 100000) / 100000,
      lon: Math.round(lon * 100000) / 100000
    };
  }

  // ---------------- Lat/lon -> grid square helper ----------------
  // The reverse of gridToLatLon() above - this one is exact, since a
  // Maidenhead locator is just a fixed-size encoding of a lat/lon pair.
  // Always produces a 6-character locator (field + square + subsquare).

  function latLonToGrid(lat, lon) {
    lat = parseFloat(lat);
    lon = parseFloat(lon);
    if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      return '';
    }

    // Shift onto a 0-360 / 0-180 range so everything divides out cleanly.
    let remLon = lon + 180;
    let remLat = lat + 90;

    const lonField = Math.min(17, Math.floor(remLon / 20));
    const latField = Math.min(17, Math.floor(remLat / 10));
    remLon -= lonField * 20;
    remLat -= latField * 10;

    const lonSquare = Math.min(9, Math.floor(remLon / 2));
    const latSquare = Math.min(9, Math.floor(remLat / 1));
    remLon -= lonSquare * 2;
    remLat -= latSquare * 1;

    const lonSub = Math.min(23, Math.floor(remLon / (2 / 24)));
    const latSub = Math.min(23, Math.floor(remLat / (1 / 24)));

    const letter = function (n) { return String.fromCharCode(65 + n); };

    return letter(lonField) + letter(latField) +
      String(lonSquare) + String(latSquare) +
      letter(lonSub).toLowerCase() + letter(latSub).toLowerCase();
  }


  // ---------------- CQ zone / ITU zone estimator ----------------
  // There is no clean formula for CQ or ITU zone - both are officially
  // defined by political/geographic boundaries (see the CQ WAZ zone
  // definitions at cqww.com), not by simple lat/lon math. Doing this
  // precisely would mean embedding a full set of boundary polygons, which
  // doesn't fit a small offline single-file tool.
  //
  // Instead, this is a rectangular-region APPROXIMATION: a list of lat/lon
  // boxes built from the official CQ WAZ zone list and a couple of other
  // published references (see the comments below), checked in order from
  // most specific to most general. It's a genuinely useful first guess for
  // most of the world, but it WILL be wrong near zone boundaries and in a
  // few irregular areas (e.g. India/Pakistan) that don't reduce to a
  // rectangle. That's why these fields get the same orange "auto-filled,
  // please double check" treatment as everything else - always verify
  // before relying on it for something like a WAZ award.
  //
  // Coverage is intentionally uneven: CQ zone is estimated for most of the
  // world, but ITU zone is only estimated where there's solid published
  // data to go on (the US, Alaska, Hawaii, Japan, and Korea). Elsewhere the
  // ITU Zone field is simply left for you to fill in.
  //
  // Rules are {lat: [min, max], lon: [min, max], zone: N}. Add, remove, or
  // adjust boxes here as needed - nothing else in the file depends on this
  // table being complete or exact.

  const CQ_ZONE_RULES = [

    { lat: [24, 49],     lon: [-125, -109], zone: 3 },  // CA, ID, NV, OR, UT, WA, AZ
    { lat: [24, 49],     lon: [-109, -83],  zone: 4 },  // Central US
    { lat: [24, 49],     lon: [-83, -66],   zone: 5 },  // Eastern US
    { lat: [55, 83],     lon: [-141, -102], zone: 1 },  // N. Canada, west of 102W
    { lat: [55, 83],     lon: [-102, -52],  zone: 2 },  // N. Canada, east of 102W
    { lat: [42, 55],     lon: [-141, -120], zone: 3 },  // British Columbia
    { lat: [42, 55],     lon: [-120, -79.5],zone: 4 },  // Alberta/Sask/Manitoba/Ontario
    { lat: [42, 55],     lon: [-79.5, -52], zone: 5 },  // S. Quebec/Maritimes/Newfoundland
    { lat: [14, 33],     lon: [-118, -86],  zone: 6 },  // Mexico
    { lat: [7, 18],      lon: [-92, -77],   zone: 7 },  // Central America
    { lat: [10, 27],     lon: [-85, -59],   zone: 8 },  // Caribbean

    // --- South America ---
    { lat: [0, 13],    lon: [-82, -51], zone: 9 },
    { lat: [-23, 2],   lon: [-82, -66], zone: 10 },
    { lat: [-34, 6],   lon: [-66, -34], zone: 11 },
    { lat: [-56, -17], lon: [-76, -66], zone: 12 },
    { lat: [-56, -21], lon: [-73, -53], zone: 13 },

    // --- Europe / Russia ---
    { lat: [60, 84], lon: [-75, -10], zone: 40 }, // Greenland/Iceland/Svalbard
    { lat: [29, 42], lon: [25, 45],   zone: 20 }, // Balkans/Turkey/Levant (before the wider boxes below)
    { lat: [36, 71], lon: [-10, 15],  zone: 14 },
    { lat: [36, 71], lon: [15, 30],   zone: 15 },
    { lat: [44, 71], lon: [30, 60],   zone: 16 },
    { lat: [40, 71], lon: [60, 80],   zone: 17 },
    { lat: [40, 75], lon: [80, 105],  zone: 18 },
    { lat: [40, 75], lon: [105, 140], zone: 19 },

    // --- Middle East / Asia ---
    { lat: [12, 38], lon: [45, 77],   zone: 21 },
    { lat: [5, 37],  lon: [77, 92],   zone: 22 },
    { lat: [35, 53], lon: [87, 120],  zone: 23 },
    { lat: [20, 42], lon: [105, 125], zone: 24 },
    { lat: [33, 43], lon: [124, 130], zone: 25 }, // Korea
    { lat: [24, 46], lon: [130, 146], zone: 25 }, // Japan
    { lat: [5, 29],  lon: [92, 110],  zone: 26 },
    { lat: [0, 21],  lon: [120, 152], zone: 27 },

    { lat: [-35, -10], lon: [112, 135], zone: 29 }, // Western Australia
    { lat: [-44, -10], lon: [135, 154], zone: 30 }, // Eastern Australia
    { lat: [-47, -34], lon: [166, 179], zone: 32 }, // New Zealand

    // --- Africa ---
    { lat: [20, 36],  lon: [-18, 12], zone: 33 },
    { lat: [4, 33],   lon: [12, 38],  zone: 34 },
    { lat: [4, 20],   lon: [-18, 15], zone: 35 },
    { lat: [-18, 10], lon: [8, 31],   zone: 36 },
    { lat: [-12, 18], lon: [31, 51],  zone: 37 },
    { lat: [-35, -12],lon: [11, 33],  zone: 38 },
    { lat: [-27, -11],lon: [43, 57],  zone: 39 }
  ];

  const ITU_ZONE_RULES = [
    { lat: [18, 23], lon: [-161, -154], zone: 61 }, // Hawaii
    { lat: [51, 72], lon: [-170, -129], zone: 1 },  // Alaska
    { lat: [24, 49], lon: [-125, -110], zone: 6 },  // Western US (wrtc2014.org/resources/itu-zones-for-us-states)
    { lat: [24, 49], lon: [-110, -90],  zone: 7 },  // Central US
    { lat: [24, 49], lon: [-90, -66],   zone: 8 },  // Eastern US
    { lat: [33, 43], lon: [124, 130],   zone: 44 }, // Korea
    { lat: [24, 46], lon: [130, 146],   zone: 45 }  // Japan
  ];

  function lookUpZone(lat, lon, rules) {
    if (isNaN(lat) || isNaN(lon)) return null;
    for (let i = 0; i < rules.length; i++) {
      const rule = rules[i];
      if (lat >= rule.lat[0] && lat <= rule.lat[1] && lon >= rule.lon[0] && lon <= rule.lon[1]) {
        return rule.zone;
      }
    }
    return null; // outside every region we have a guess for - leave it to the user
  }

  function estimateCqZone(lat, lon) {
    return lookUpZone(lat, lon, CQ_ZONE_RULES);
  }

  function estimateItuZone(lat, lon) {
    return lookUpZone(lat, lon, ITU_ZONE_RULES);
  }


  // ---------------- Cascading auto-fill: grid <-> lat/lon -> CQ/ITU zone ----------------
  // These tie the helpers above together and are the only functions the
  // rest of the app calls directly.

  function fillZonesFromLatLon(prefix, lat, lon) {
    const cq = estimateCqZone(lat, lon);
    if (cq !== null) {
      document.getElementById(prefix + 'CqZone').value = cq;
      document.getElementById(prefix + 'CqZone').classList.add('auto-filled');
    }
    const itu = estimateItuZone(lat, lon);
    if (itu !== null) {
      document.getElementById(prefix + 'ItuZone').value = itu;
      document.getElementById(prefix + 'ItuZone').classList.add('auto-filled');
    }
  }

  function fillFromGrid(prefix) {
    // prefix is 'rx' or 'tx'. Grid square -> lat/lon -> CQ/ITU zone.
    const coords = gridToLatLon(document.getElementById(prefix + 'Grid').value);
    if (!coords) return;

    document.getElementById(prefix + 'Lat').value = coords.lat;
    document.getElementById(prefix + 'Lon').value = coords.lon;
    document.getElementById(prefix + 'Lat').classList.add('auto-filled');
    document.getElementById(prefix + 'Lon').classList.add('auto-filled');

    fillZonesFromLatLon(prefix, coords.lat, coords.lon);
  }

  function fillFromLatLon(prefix) {
    // prefix is 'rx' or 'tx'. Lat/lon -> grid square, and -> CQ/ITU zone.
    const latVal = document.getElementById(prefix + 'Lat').value;
    const lonVal = document.getElementById(prefix + 'Lon').value;
    if (latVal === '' || lonVal === '') return;

    const lat = parseFloat(latVal);
    const lon = parseFloat(lonVal);
    if (isNaN(lat) || isNaN(lon)) return;

    const grid = latLonToGrid(lat, lon);
    if (grid) {
      document.getElementById(prefix + 'Grid').value = grid;
      document.getElementById(prefix + 'Grid').classList.add('auto-filled');
    }

    fillZonesFromLatLon(prefix, lat, lon);
  }


  // ---------------- Writing an ADIF (.adi) file ----------------

  function buildAdifFile(qsos) {
    let output = 'ADIF export generated by ADIF Log Manager\n';
    output += '<ADIF_VER:5>3.1.4\n';
    output += '<PROGRAMID:16>ADIF Log Manager\n';
    output += '<EOH>\n\n';

    qsos.forEach(function (qso) {
      let line = '';
      fieldMap.forEach(function (f) {
        const rawValue = qso[f.formId];
        if (!rawValue) return; // skip empty/optional fields entirely

        let adifValue;
        if (f.type === 'date') {
          adifValue = dateToAdif(rawValue);
        } else if (f.type === 'time') {
          adifValue = timeToAdif(rawValue);
        } else if (f.type === 'location-lat') {
          adifValue = decimalToAdifLocation(rawValue, true);
        } else if (f.type === 'location-lon') {
          adifValue = decimalToAdifLocation(rawValue, false);
        } else {
          adifValue = rawValue;
        }

        if (!adifValue) return;
        line += '<' + f.adif + ':' + adifValue.length + '>' + adifValue + ' ';
      });

      if (qso.extraFields) {
        Object.keys(qso.extraFields).forEach(function (name) {
          const value = qso.extraFields[name];
          if (!value) return;
          line += '<' + name + ':' + value.length + '>' + value + ' ';
        });
      }

      line += '<EOR>';
      output += line.trim() + '\n';
    });

    return output;
  }


  // ---------------- Reading an ADIF (.adi) file ----------------

  function parseAdifFile(text) {
    // Everything before <EOH> is header info we don't need to keep -
    // we always write a fresh header when saving.
    let body = text;
    const eohMatch = text.match(/<eoh>/i);
    if (eohMatch) {
      body = text.slice(eohMatch.index + eohMatch[0].length);
    }

    // Each QSO record is terminated by <EOR>.
    const recordChunks = body.split(/<eor>/i);

    const parsedQsos = [];
    recordChunks.forEach(function (chunk) {
      if (!chunk.trim()) return;
      const adifFields = parseAdifFieldsFromChunk(chunk);
      if (Object.keys(adifFields).length === 0) return;
      parsedQsos.push(convertAdifFieldsToQso(adifFields));
    });

    return parsedQsos;
  }

  function parseAdifFieldsFromChunk(chunk) {
    // ADIF fields look like <NAME:LENGTH>VALUE where VALUE is exactly
    // LENGTH characters long. We can't just split on '<' and '>' because
    // VALUE itself could theoretically contain those characters, so we
    // walk through the text and use the stated length to find each value.
    const fields = {};
    let pos = 0;

    while (true) {
      const ltPos = chunk.indexOf('<', pos);
      if (ltPos === -1) break;
      const gtPos = chunk.indexOf('>', ltPos);
      if (gtPos === -1) break;

      const tagParts = chunk.slice(ltPos + 1, gtPos).split(':');
      const fieldName = tagParts[0].toUpperCase();
      const length = parseInt(tagParts[1], 10);

      if (!isNaN(length)) {
        const value = chunk.substr(gtPos + 1, length);
        fields[fieldName] = value;
        pos = gtPos + 1 + length;
      } else {
        // No length on this tag - just skip past it.
        pos = gtPos + 1;
      }
    }

    return fields;
  }

  function convertAdifFieldsToQso(adifFields) {
    const qso = {};
    fieldMap.forEach(function (f) {
      const rawValue = adifFields[f.adif];
      if (rawValue === undefined) {
        qso[f.formId] = '';
        return;
      }
      if (f.type === 'date') {
        qso[f.formId] = adifToDate(rawValue);
      } else if (f.type === 'time') {
        qso[f.formId] = adifToTime(rawValue);
      } else if (f.type === 'location-lat' || f.type === 'location-lon') {
        qso[f.formId] = adifLocationToDecimal(rawValue);
      } else {
        qso[f.formId] = rawValue;
      }
    });

    // Anything in the record that isn't one of our known fields gets kept
    // as-is, so it isn't lost - it shows up in the "Other ADIF Fields"
    // section of the form instead.
    qso.extraFields = {};
    Object.keys(adifFields).forEach(function (name) {
      if (!knownAdifNames.has(name)) {
        qso.extraFields[name] = adifFields[name];
      }
    });

    return qso;
  }


  // ---------------- Extra (unmapped/custom) ADIF fields ----------------

  function populateOtherAdifFieldsDatalist() {
    const datalist = document.getElementById('otherAdifFieldsList');
    allAdifFieldNames.forEach(function (name) {
      if (knownAdifNames.has(name)) return; // already has its own field above
      const option = document.createElement('option');
      option.value = name;
      datalist.appendChild(option);
    });

  // ---------------- Online callsign lookup (optional, needs internet) ----------------
  // Everything else in this file works fully offline. This one feature is the
  // exception: it tries to fill in QTH City/State/Country, Grid Square, and
  // Lat/Lon from just a callsign.
  //
  // Callook.info (https://callook.info) is the primary source - US callsigns
  // only, but confirmed to work with a plain client-side fetch() over HTTPS.
  //
  // HamDB.org would cover non-US callsigns too, but it CANNOT be called
  // directly from a browser on an HTTPS page: confirmed via a real console
  // error, HamDB's server redirects an https:// request to a plain http://
  // URL (e.g. https://api.hamdb.org/UR4QWW/... redirects to
  // http://api.hamdb.org/v1/ur4qww/...), and browsers block following a
  // redirect that downgrades to an insecure URL ("Mixed Content" error).
  // This is a bug in HamDB's own server, not something fixable by changing
  // the URL we request - so it isn't called directly here at all.
  //
  // To restore non-US lookups, deploy the small proxy in
  // hamdb-proxy-worker.js (a free Cloudflare Worker - see its comments for
  // deploy steps) and paste its URL into HAMDB_PROXY_URL below. A server
  // calling HamDB isn't subject to the browser's mixed-content rule, so the
  // proxy can reach HamDB fine and hand the result back over HTTPS. Leave
  // HAMDB_PROXY_URL blank to just use Callook.info (US-only).
  //
  // If there's no internet connection, nothing configured can be reached,
  // or the callsign just isn't found, this fails quietly and leaves the
  // fields for you to fill in by hand - it never blocks anything else in
  // the tool.
  //
  // Only triggered when you click the "Look up online" button, never
  // automatically, since it's the one thing here that reaches out to the
  // network.

  const HAMDB_PROXY_URL = ''; // e.g. 'https://your-worker.your-subdomain.workers.dev'

  async function tryCallookLookup(callsign) {
    try {
      const response = await fetch('https://callook.info/' + encodeURIComponent(callsign) + '/json');
      if (!response.ok) return null;

      const data = await response.json();
      if (data.status !== 'VALID') return null; // includes INVALID and UPDATING

      const result = { city: '', state: '', country: 'United States', grid: '', lat: '', lon: '', name: '' };

      if (data.name) result.name = data.name; // e.g. "SMITH, JOHN Q" or a club name

      // address.line2 looks like "NEWINGTON, CT 06111" - split into city/state.
      if (data.address && data.address.line2) {
        const match = data.address.line2.match(/^([^,]+),\s*([A-Z]{2})\s+\d/i);
        if (match) {
          result.city = match[1].trim();
          result.state = match[2].trim().toUpperCase();
        }
      }
      if (data.location) {
        if (data.location.gridsquare) result.grid = data.location.gridsquare;
        if (data.location.latitude) result.lat = data.location.latitude;
        if (data.location.longitude) result.lon = data.location.longitude;
      }

      return result;
    } catch (err) {
      return null; // offline, network error, unexpected response shape, etc.
    }
  }

  async function tryHamdbLookup(callsign) {
    if (!HAMDB_PROXY_URL) return null; // not configured - Callook-only until it is

    let response;
    try {
      const url = HAMDB_PROXY_URL + '?callsign=' + encodeURIComponent(callsign);
      response = await fetch(url);
    } catch (err) {
      // Couldn't reach the proxy itself (wrong URL, DNS failure, offline, etc.)
      // - distinct from a normal "callsign not found" result.
      throw new Error('PROXY_UNREACHABLE');
    }

    if (!response.ok) return null; // proxy reached fine, but it (or HamDB) reported an error

    try {
      const data = await response.json();
      const record = data && data.hamdb && data.hamdb.callsign;
      const status = data && data.hamdb && data.hamdb.messages && data.hamdb.messages.status;
      if (!record || status === 'NOT_FOUND') return null;

      const result = { city: '', state: '', country: '', grid: '', lat: '', lon: '', name: '' };
      if (record.country) result.country = record.country;
      if (record.state) result.state = record.state;
      // addr2 is usually a "CITY, STATE ZIP"-style line - just take the city part.
      if (record.addr2) {
        const city = record.addr2.split(',')[0].trim();
        if (city) result.city = city;
      }
      if (record.grid) result.grid = record.grid;
      // HamDB also gives an exact lat/lon, same as Callook - use it the
      // same way (see applyLookupResult) rather than only the grid square.
      if (record.lat) result.lat = record.lat;
      if (record.lon) result.lon = record.lon;
      // HamDB splits the name into parts rather than one combined field.
      const nameParts = [record.fname, record.mi, record.name, record.suffix]
        .filter(function (part) { return part && part.trim(); });
      if (nameParts.length > 0) result.name = nameParts.join(' ');

      const gotSomething = result.city || result.state || result.country ||
        result.grid || (result.lat && result.lon) || result.name;
      return gotSomething ? result : null;
    } catch (err) {
      return null; // unexpected response shape from the proxy - treat as "not found"
    }
  }

  function applyLookupResult(prefix, result) {
    let filledSomething = false;

    // Only the Receiver side gets the licensee's name copied into Operator -
    // the Sender side's Operator is whoever's actually at the key/mic, which
    // an online lookup of your own callsign has no way to know.
    if (prefix === 'rx' && result.name) {
      document.getElementById('rxOperator').value = result.name;
      document.getElementById('rxOperator').classList.add('auto-filled');
      filledSomething = true;
    }

    if (result.country) {
      document.getElementById(prefix + 'Country').value = result.country;
      document.getElementById(prefix + 'Country').classList.add('auto-filled');
      filledSomething = true;
    }
    if (result.state) {
      document.getElementById(prefix + 'State').value = result.state;
      document.getElementById(prefix + 'State').classList.add('auto-filled');
      filledSomething = true;
    }
    if (result.city) {
      document.getElementById(prefix + 'City').value = result.city;
      document.getElementById(prefix + 'City').classList.add('auto-filled');
      filledSomething = true;
    }
    if (result.lat && result.lon) {
      // The lookup service gave an exact lat/lon - use that directly rather
      // than re-deriving it from the grid square, which would only give the
      // center of that grid cell (a coarser approximation).
      document.getElementById(prefix + 'Lat').value = result.lat;
      document.getElementById(prefix + 'Lon').value = result.lon;
      document.getElementById(prefix + 'Lat').classList.add('auto-filled');
      document.getElementById(prefix + 'Lon').classList.add('auto-filled');

      if (result.grid) {
        document.getElementById(prefix + 'Grid').value = result.grid;
      } else {
        // No grid square in the response - derive one from the precise
        // lat/lon we do have, using the same math as everywhere else.
        const derivedGrid = latLonToGrid(parseFloat(result.lat), parseFloat(result.lon));
        if (derivedGrid) document.getElementById(prefix + 'Grid').value = derivedGrid;
      }
      document.getElementById(prefix + 'Grid').classList.add('auto-filled');

      // CQ/ITU zone from the precise coordinates, same as manual entry would.
      fillZonesFromLatLon(prefix, parseFloat(result.lat), parseFloat(result.lon));
      filledSomething = true;
    } else if (result.grid) {
      // No direct lat/lon in the response, but we do have a grid square -
      // fall back to the existing grid -> lat/lon -> zone cascade.
      document.getElementById(prefix + 'Grid').value = result.grid;
      document.getElementById(prefix + 'Grid').classList.add('auto-filled');
      fillFromGrid(prefix);
      filledSomething = true;
    }

    return filledSomething;
  }

  async function lookupCallsignOnline(prefix) {
    // prefix is 'rx' or 'tx'.
    const callsign = document.getElementById(prefix + 'Call').value.trim().toUpperCase();
    const statusEl = document.getElementById(prefix + 'LookupStatus');

    if (!callsign) {
      statusEl.textContent = 'Enter a callsign first.';
      return;
    }

    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      statusEl.textContent = 'You appear to be offline.';
      return;
    }

    statusEl.textContent = 'Looking up...';

    let result = await tryCallookLookup(callsign);
    let source = 'Callook.info';

    if (!result) {
      try {
        result = await tryHamdbLookup(callsign);
        source = 'HamDB.org';
      } catch (err) {
        if (err.message === 'PROXY_UNREACHABLE') {
          statusEl.textContent = 'Cannot connect to Cloudflare Worker.';
          return;
        }
        // Anything else unexpected - fall through to the generic not-found message below.
      }
    }

    if (!result) {
      statusEl.textContent = "Couldn't find that callsign on either lookup service.";
      return;
    }

    const filledSomething = applyLookupResult(prefix, result);
    statusEl.textContent = filledSomething
      ? 'Found on ' + source + ' - filled in what was available.'
      : 'Found the callsign, but no location data was available.';
  }

    { code: 'tx', name: 'Texas' }, { code: 'ut', name: 'Utah' },
    { code: 'vt', name: 'Vermont' }, { code: 'va', name: 'Virginia' },
    { code: 'wa', name: 'Washington' }, { code: 'wv', name: 'West Virginia' },
    { code: 'wi', name: 'Wisconsin' }, { code: 'wy', name: 'Wyoming' },
    { code: 'dc', name: 'District of Columbia' },
    // US territories - these have their own top-level flag code on flagcdn
    // (e.g. flagcdn.com/pr.png), not a "us-xx" state-subdivision code, so
    // they're marked isTerritory to build their image URL differently
    // (see buildFlagsHtml). They're still part of the United States for
    // country-flag purposes.
    { code: 'pr', name: 'Puerto Rico', isTerritory: true },
    { code: 'gu', name: 'Guam', isTerritory: true },
    { code: 'vi', name: 'U.S. Virgin Islands', isTerritory: true },
    { code: 'as', name: 'American Samoa', isTerritory: true },
    { code: 'mp', name: 'Northern Mariana Islands', isTerritory: true }
  ];

  const US_STATE_LOOKUP = {};
  US_STATES.forEach(function (s) {
    US_STATE_LOOKUP[s.name.toUpperCase()] = s;
    US_STATE_LOOKUP[s.code.toUpperCase()] = s;
  });

  function escapeHtmlAttribute(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildFlagsHtml(qso) {
    let country = qso.rxCountry ? COUNTRY_LOOKUP[qso.rxCountry.trim().toUpperCase()] : null;
    const state = qso.rxState ? US_STATE_LOOKUP[qso.rxState.trim().toUpperCase()] : null;

    // Some ADIF files (or manual entries) only fill in State, not Country -
    // a recognized US state or territory is a reliable enough signal to
    // infer the country ourselves, as long as Country wasn't already set to
    // something else we recognize.
    if (!country && state) {
      country = COUNTRY_LOOKUP['UNITED STATES'];
    }

    let html = '';

    if (country && country.code === 'us' && state) {
      // The 50 states use flagcdn's "us-xx" subdivision codes; territories
      // like Puerto Rico have their own top-level code instead.
      const stateFlagCode = state.isTerritory ? state.code : 'us-' + state.code;
      html += '<img src="https://flagcdn.com/20x15/' + stateFlagCode + '.png" ' +
        'alt="" title="' + escapeHtmlAttribute(state.name) + '" class="flag-icon" ' +
        'onerror="this.style.display=\'none\'"> ';
    }

    if (country) {
      html += '<img src="https://flagcdn.com/20x15/' + country.code + '.png" ' +
        'alt="" title="' + escapeHtmlAttribute(country.name) + '" class="flag-icon" ' +
        'onerror="this.style.display=\'none\'">';
    }

    return html;
  }


  // ---------------- UI actions ----------------

  function refreshTable() {
    const tbody = document.getElementById('qsoTableBody');
    tbody.innerHTML = '';

    qsoList.forEach(function (qso, index) {
      const row = document.createElement('tr');
      if (getMissingRequiredFields(qso).length > 0) {
        row.classList.add('incomplete-qso');
      }
      row.innerHTML =
        '<td>' + (qso.qsoDate || '') + '</td>' +
        '<td>' + (qso.qsoTime || '') + '</td>' +
        '<td>' + (qso.qsoBand || '') + '</td>' +
        '<td>' + (qso.qsoMode || '') + '</td>' +
        '<td>' + (qso.rxCall || '') + ' ' + buildFlagsHtml(qso) + '</td>' +
        '<td>' +
          '<button onclick="editEntry(' + index + ')">Edit</button>' +
          '<button onclick="deleteEntry(' + index + ')">Delete</button>' +
        '</td>';
      tbody.appendChild(row);
    });
  }

  function addNewEntry() {
    editingIndex = null;
    clearForm();

    // New entries inherit band, frequency, mode, and TX power from the
    // most recent QSO in the log, since those usually don't change QSO
    // to QSO during an operating session.
    if (qsoList.length > 0) {
      const lastQso = qsoList[qsoList.length - 1];
      document.getElementById('qsoBand').value = lastQso.qsoBand || '';
      document.getElementById('qsoFreq').value = lastQso.qsoFreq || '';
      document.getElementById('qsoMode').value = lastQso.qsoMode || '';
      document.getElementById('qsoTxPower').value = lastQso.qsoTxPower || '';
    }

    // Date/time are always set to right now.
    document.getElementById('qsoDate').value = getCurrentUtcDateString();
    document.getElementById('qsoTime').value = getCurrentUtcTimeString();

    // Sender callsign/operator/grid come from the Station Setup fields.
    document.getElementById('txCall').value = document.getElementById('mainCallsign').value;
    document.getElementById('txOperator').value = document.getElementById('mainOperator').value;
    document.getElementById('txGrid').value = document.getElementById('mainGrid').value;
    fillFromGrid('tx'); // fills in txLat/txLon/txCqZone/txItuZone if the grid above is valid

    // New entries start with no extra fields - add any you want with the button.
    renderExtraFieldsRows({});

    document.getElementById('rxLookupStatus').textContent = '';
    document.getElementById('txLookupStatus').textContent = '';

    clearRequiredFieldHighlights();
    hideMissingFieldsWarning();

    document.getElementById('formTitle').textContent = 'New QSO';
    document.getElementById('entryFormOverlay').style.display = 'flex';
  }

  function editEntry(index) {
    editingIndex = index;
    writeQsoIntoForm(qsoList[index]);
    renderExtraFieldsRows(qsoList[index].extraFields);
    document.getElementById('rxLookupStatus').textContent = '';
    document.getElementById('txLookupStatus').textContent = '';

    clearRequiredFieldHighlights();
    const missingFields = getMissingRequiredFields(qsoList[index]);
    if (missingFields.length > 0) {
      highlightMissingFields(missingFields);
      showMissingFieldsWarning(missingFields);
    } else {
      hideMissingFieldsWarning();
    }

    document.getElementById('formTitle').textContent = 'Edit QSO';
    document.getElementById('entryFormOverlay').style.display = 'flex';
  }

  function deleteEntry(index) {
    if (confirm('Delete this QSO entry?')) {
      qsoList.splice(index, 1);
      refreshTable();
    }
  }

  function saveEntry() {
    const qso = readFormIntoQso();

    clearRequiredFieldHighlights();
    const missingFields = getMissingRequiredFields(qso);
    if (missingFields.length > 0) {
      highlightMissingFields(missingFields);
      showMissingFieldsWarning(missingFields);
      return;
    }
    hideMissingFieldsWarning();

    const extraFields = readExtraFieldsFromForm();
    for (const name in extraFields) {
      if (knownAdifNames.has(name)) {
        alert('"' + name + '" is already one of the fields above - remove it from ' +
              'Other ADIF Fields and use the matching field in the form instead.');
        return;
      }
    }
    qso.extraFields = extraFields;

    if (editingIndex === null) {
      qsoList.push(qso);
    } else {
      qsoList[editingIndex] = qso;
    }

    document.getElementById('entryFormOverlay').style.display = 'none';
    refreshTable();
  }

  function cancelEntry() {
    document.getElementById('entryFormOverlay').style.display = 'none';
  }

  function newFile() {
    if (qsoList.length > 0 && !confirm('Start a new file? Any unsaved entries will be lost.')) {
      return;
    }
    qsoList = [];
    currentFileName = 'log.adi';
    document.getElementById('currentFileLabel').textContent = '(no file loaded)';
    document.getElementById('entryFormOverlay').style.display = 'none';
    refreshTable();
  }

  function openFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      qsoList = parseAdifFile(e.target.result);
      currentFileName = file.name;
      document.getElementById('currentFileLabel').textContent = file.name;
      document.getElementById('entryFormOverlay').style.display = 'none';
      refreshTable();
    };
    reader.readAsText(file);
  }

  function buildSuggestedFilename(baseName) {
    // Prefixes today's date (local time - this is just for naming the
    // download, not an ADIF value) in YYYY.MM.DD form onto a base filename.
    const today = new Date();
    const datePrefix = today.getFullYear() + '.' +
      String(today.getMonth() + 1).padStart(2, '0') + '.' +
      String(today.getDate()).padStart(2, '0');
    return datePrefix + '.' + baseName;
  }

  function saveFile() {
    const suggestedName = buildSuggestedFilename(currentFileName);
    const chosenName = prompt('Save ADIF file as:', suggestedName);
    if (!chosenName) return; // user cancelled the prompt

    const adifText = buildAdifFile(qsoList);
    const blob = new Blob([adifText], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);

    const link = document.createElement('a');
    link.href = url;
    link.download = chosenName;
    link.click();

    URL.revokeObjectURL(url);
    currentFileName = chosenName; // future saves default to this name
  }


  // ---------------- Exporting to CSV ----------------
  // A flat spreadsheet view of the log - handy for sorting/filtering in
  // Excel or Sheets, but it's a one-way export, not something this tool
  // can read back in (use the ADIF save/open for that).

  function csvEscapeValue(value) {
    const str = value === null || value === undefined ? '' : String(value);
    if (/[",\r\n]/.test(str)) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  function buildCsvFile(qsos) {
    // One column per known field (using its ADIF name as the header), plus
    // a column for each custom "Other ADIF Fields" name used anywhere in
    // the log, so nothing gets silently left out of the export.
    const extraFieldNames = new Set();
    qsos.forEach(function (qso) {
      if (qso.extraFields) {
        Object.keys(qso.extraFields).forEach(function (name) {
          extraFieldNames.add(name);
        });
      }
    });
    const sortedExtraNames = Array.from(extraFieldNames).sort();

    const headers = fieldMap.map(function (f) { return f.adif; }).concat(sortedExtraNames);
    const lines = [headers.map(csvEscapeValue).join(',')];

    qsos.forEach(function (qso) {
      const row = fieldMap.map(function (f) { return qso[f.formId] || ''; });
      sortedExtraNames.forEach(function (name) {
        row.push((qso.extraFields && qso.extraFields[name]) || '');
      });
      lines.push(row.map(csvEscapeValue).join(','));
    });

    return lines.join('\r\n');
  }

  function exportCsv() {
    const baseName = currentFileName.replace(/\.[^.]+$/, '') + '.csv';
    const suggestedName = buildSuggestedFilename(baseName);
    const chosenName = prompt('Export CSV as:', suggestedName);
    if (!chosenName) return;

    const csvText = buildCsvFile(qsoList);
    const blob = new Blob([csvText], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);

    const link = document.createElement('a');
    link.href = url;
    link.download = chosenName;
    link.click();

    URL.revokeObjectURL(url);
  }


  // ---------------- Wire everything up ----------------

  document.getElementById('newFileBtn').addEventListener('click', newFile);
  document.getElementById('openFileInput').addEventListener('change', openFile);
  document.getElementById('saveFileBtn').addEventListener('click', saveFile);
  document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
  document.getElementById('addNewBtn').addEventListener('click', addNewEntry);
  document.getElementById('saveEntryBtn').addEventListener('click', saveEntry);
  document.getElementById('cancelEntryBtn').addEventListener('click', cancelEntry);
  document.getElementById('addExtraFieldBtn').addEventListener('click', function () {
    addExtraFieldRow('', '');
  });
  document.getElementById('rxLookupBtn').addEventListener('click', function () {
    lookupCallsignOnline('rx');
  });
  document.getElementById('txLookupBtn').addEventListener('click', function () {
    lookupCallsignOnline('tx');
  });

  // Typing a grid square auto-fills that station's lat/lon and CQ/ITU zone.
  document.getElementById('rxGrid').addEventListener('input', function () {
    this.classList.remove('auto-filled'); // this is a manual edit, not an auto-fill
    fillFromGrid('rx');
  });
  document.getElementById('txGrid').addEventListener('input', function () {
    this.classList.remove('auto-filled');
    fillFromGrid('tx');
  });

  // Typing a lat or lon auto-fills that station's grid square and CQ/ITU zone.
  ['rxLat', 'rxLon'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      document.getElementById('rxLat').classList.remove('auto-filled');
      document.getElementById('rxLon').classList.remove('auto-filled');
      fillFromLatLon('rx');
    });
  });
  ['txLat', 'txLon'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      document.getElementById('txLat').classList.remove('auto-filled');
      document.getElementById('txLon').classList.remove('auto-filled');
      fillFromLatLon('tx');
    });
  });

  // If the user edits an auto-filled CQ/ITU zone by hand, drop the orange
  // highlight - same "manual edit wins" rule as everywhere else.
  ['rxCqZone', 'rxItuZone', 'txCqZone', 'txItuZone'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      this.classList.remove('auto-filled');
    });
  });

  // As the user fills in a required field, drop its red border right away
  // and update (or hide) the missing-fields banner to match, rather than
  // making them hit Save again just to see the warning clear.
  REQUIRED_FIELDS.forEach(function (adifName) {
    const formId = getFormIdForAdifName(adifName);
    if (!formId) return; // unrecognized name - already warned about at load time
    document.getElementById(formId).addEventListener('input', function () {
      this.classList.remove('missing-required');
      const stillMissing = getMissingRequiredFields(readFormIntoQso());
      if (stillMissing.length > 0) {
        showMissingFieldsWarning(stillMissing);
      } else {
        hideMissingFieldsWarning();
      }
    });
  });

  populateOtherAdifFieldsDatalist();
  attachFieldHelpIcons();
  attachSectionHelpIcons();
  warnAboutUnknownRequiredFields();
  refreshTable();

</script>
