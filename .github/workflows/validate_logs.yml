name: Validate and Combine ADIF Logs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-combine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Run ADIF Processing Script
      run: python tests/process_logs.py

    - name: Upload Combined Log Artifact
      uses: actions/upload-artifact@v4
      with:
        name: combined-adif-log
        path: combined_logs.adi

    - name: Commit Combined Log Back to Repository
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add combined_logs.adi
        git diff --staged --quiet || (git commit -m "chore: update combined ADIF log [skip ci]" && git push)